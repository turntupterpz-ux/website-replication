<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParcelPort Demo</title>
<style>
  :root {
    --bar: #111;
    --blue: #00a6ff;
    --green: #7dc566;
    --text: #333;
    --muted: #888;
    --line: #ccc;
    --alt: #f4f4f4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: #fff; }
  .demo-banner { background: #ffcc00; color: #000; text-align: center; font-weight: 700; padding: 8px; font-size: 14px; }
  header { background: var(--bar); height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .logo { color: #fff; font-weight: 800; font-size: 22px; letter-spacing: .5px; }
  .logo span { color: var(--blue); }
  .menu { width: 36px; display: grid; gap: 6px; }
  .menu i { display: block; height: 4px; background: #fff; }
  .actions { display: flex; justify-content: space-around; padding: 16px 8px;
    background: repeating-linear-gradient(135deg, #fafafa 0 24px, #f2f2f2 24px 48px); }
  .action { width: 96px; height: 96px; border-radius: 50%; border: 4px solid #eee; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; }
  .action .ico { font-size: 28px; margin-bottom: 4px; }
  main { padding: 24px 16px; max-width: 640px; margin: 0 auto; }
  .search { display: flex; border: 2px solid #ddd; border-radius: 4px; overflow: hidden; }
  .search input { flex: 1; border: 0; padding: 12px; font-size: 17px; min-width: 0; }
  .search button { width: 56px; border: 0; border-left: 2px solid #ddd; background: #eee; font-size: 18px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 4px; padding: 14px; font-size: 18px; color: #fff; background: var(--blue); cursor: pointer; }
  .btn.green { background: var(--green); margin-top: 20px; }
  .btn.outline { background: #fff; color: var(--blue); border: 2px solid var(--blue); }
  hr { border: 0; border-top: 2px solid var(--line); margin: 24px 0 0; }
  .card { padding: 20px 14px 24px; border-bottom: 2px solid var(--line); }
  .card:nth-child(even) { background: var(--alt); }
  .card .info { padding-left: 70px; }
  .status { font-weight: 700; font-size: 14px; }
  .status.processing { color: #bbb; }
  .status.delivered { color: #3a9a00; }
  .status.input { color: #e08a00; }
  .name { color: var(--blue); font-size: 22px; margin: 6px 0; }
  .date { color: var(--muted); font-size: 14px; }
  .track { color: var(--blue); font-size: 15px; margin-top: 6px; font-family: monospace; }
  .card .btn { margin-top: 16px; }
</style>
</head>
<body>
  <div class="demo-banner">DEMO — fictional company, sample data only</div>
  <header>
    <div class="logo">Parcel<span>Port</span></div>
    <div class="menu"><i></i><i></i><i></i></div>
  </header>

  <div class="actions">
    <div class="action"><div class="ico">🏷️</div>Single</div>
    <div class="action"><div class="ico">📁</div>Upload</div>
    <div class="action"><div class="ico">🔗</div>Import</div>
  </div>

  <main>
    <form class="search" onsubmit="return false">
      <input type="search" placeholder="Search previous labels" aria-label="Search">
      <button aria-label="Search">🔍</button>
    </form>
    <div class="row">
      <button class="btn">End of Day</button>
      <button class="btn">Schedule Pickup</button>
    </div>
    <button class="btn green">Print Selected Labels</button>
    <hr>
    <section id="list"></section>
  </main>

<script>
  const shipments = [
    { status: "processing", label: "Processing", name: "Sample Customer A", date: "Monday, 1/1/24 9:00 AM", action: "Input Needed" },
    { status: "delivered", label: "Delivered", name: "Sample Customer B", date: "Monday, 1/1/24 10:15 AM", track: "DEMO-0001" },
    { status: "input", label: "Input Needed", name: "Sample Customer C", date: "Tuesday, 1/2/24 11:30 AM", action: "Input Needed" },
    { status: "delivered", label: "Delivered", name: "Sample Customer D", date: "Tuesday, 1/2/24 2:45 PM", track: "DEMO-0002" },
    { status: "processing", label: "Processing", name: "Sample Customer E", date: "Wednesday, 1/3/24 4:00 PM", action: "Input Needed" },
    { status: "delivered", label: "Delivered", name: "Sample Customer F", date: "Thursday, 1/4/24 8:20 AM", track: "DEMO-0003" }
  ];
  document.getElementById("list").innerHTML = shipments.map(s => `
    <div class="card">
      <div class="info">
        <div class="status ${s.status}">${s.label}</div>
        <div class="name">${s.name}</div>
        <div class="date">${s.date}</div>
        ${s.track ? `<div class="track">${s.track}</div>` : ""}
      </div>
      ${s.action ? `<button class="btn">${s.action}</button>` : `<button class="btn outline">View Details</button>`}
    </div>`).join("");
</script>
</body>
</html>
